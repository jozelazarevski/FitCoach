target-version = "py312"
line-length = 120

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "S",     # flake8-bandit (security)
]
ignore = [
    "S101",  # assert used (fine in tests)
    "S311",  # random not for crypto (fine for recipe suggestions)
    "S104",  # binding to 0.0.0.0 (intentional for Docker)
    "E501",  # line too long (handled by formatter)
]

[lint.per-file-ignores]
"tests/*" = ["S"]

[format]
quote-style = "single"
